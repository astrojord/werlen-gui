[package]
name = "werlen-gui"
version = "0.1.0"
description = "werlen item shop gen (egui)"
authors = ["Jordan Sheely <astrojord@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
chrono = "0.4"
csv = "1.4"
directories = "6"
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
rand = "0.10.1"
rfd = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
